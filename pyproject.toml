[project]
name = "superset-agent-cli"
version = "0.1.0"
description = "Agent-friendly CLI for self-hosted Apache Superset"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28.1",
  "playwright>=1.53.0",
  "pydantic>=2.11.7",
  "pyyaml>=6.0.2",
  "typer>=0.16.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4.1",
]

[project.scripts]
superset-agent = "superset_agent_cli.main:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
